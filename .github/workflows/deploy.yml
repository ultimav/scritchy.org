name: Build and deploy site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.6'

      - name: Install dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs=4 --retry=3

      - name: Build site
        run: bundle exec jekyll build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to website
        env:
          DEPLOY_REMOTE_PORT: ${{ secrets.DEPLOY_REMOTE_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REMOTE: ${{ secrets.DEPLOY_REMOTE }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$DEPLOY_REMOTE_PORT" "$DEPLOY_USER@$DEPLOY_REMOTE" /admin/bin/rmVarHtml.sh
          echo "copying new"
          scp -o StrictHostKeyChecking=no -r -P "$DEPLOY_REMOTE_PORT" _site/* "$DEPLOY_USER@$DEPLOY_REMOTE:/var/www/html/"
          echo "copying files"
          ssh -o StrictHostKeyChecking=no -p "$DEPLOY_REMOTE_PORT" "$DEPLOY_USER@$DEPLOY_REMOTE" "mkdir -p /var/www/html/files/"
          scp -o StrictHostKeyChecking=no -r -P "$DEPLOY_REMOTE_PORT" files/.htaccess "$DEPLOY_USER@$DEPLOY_REMOTE:/var/www/html/files/.htaccess"
          scp -o StrictHostKeyChecking=no -r -P "$DEPLOY_REMOTE_PORT" files/* "$DEPLOY_USER@$DEPLOY_REMOTE:/var/www/html/files/"